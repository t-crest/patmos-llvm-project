import lit.formats

targets = set(config.root.targets_to_build.split())
if not 'Patmos' in targets:
    config.unsupported = True

# Use lit's internal shell (required going forward in LLVM 24+).
config.test_format = lit.formats.ShTest(execute_external=False)

# Complete path to _start function
_start_file=os.path.dirname(__file__) + "/_start.ll"

# Make sure the _start function file doesn't get treated as a test
config.excludes.add("_start.ll")

# setup substitution for %test_no_runtime_execution.
config.substitutions.append(('%test_no_runtime_execution',
	# Compile program
	"llc %s -filetype=obj -o %t_lit_cfg_compiled && " +
	# Compile startup function
	"llc " + _start_file + " -filetype=obj -o %t_lit_cfg_start && " +
	# Link program and startup function and emit ELF
	"ld.lld --nostdlib --static -o %t %t_lit_cfg_start %t_lit_cfg_compiled && " +
	# Run program
	"pasim %t -c 800"
))

# `%XFAIL-filecheck` is a suffix used like: `command %XFAIL-filecheck %s`.
# It captures merged stdout/stderr, forces a mismatch marker when `command`
# succeeds, then checks the captured output with FileCheck.
config.substitutions.append(('%XFAIL-filecheck',
	"> \"%t_xfail-filecheck_output\" 2>&1 && echo \"XFAIL-filecheck: Expected failure, but was success.\" > \"%t_xfail-filecheck_output\"; FileCheck --input-file \"%t_xfail-filecheck_output\""
))
