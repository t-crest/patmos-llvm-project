
script=os.path.dirname(__file__) + "/../../../assert_correct.py"
generator=os.path.dirname(__file__) + "/../../../generate_intrinsic_test.py"
llc = next((x[1] for x in config.substitutions if 'llc' in x[0]), "llc not found")
_start_file=os.path.dirname(__file__) + "/../../../_start.ll"
_start_indirect_file=os.path.dirname(__file__) + "/../../../_start_indirect.ll"
_compensation_file=os.path.dirname(__file__) + "/../../../__patmos_main_mem_access_compensation.ll"

def get_substitution(memset_length_type, start_file, sp_root):
	test_file = "%t-memset-" + memset_length_type + ".ll"
	result = "python3 " + generator + " memset %S/check_set.ll " + test_file + " " + memset_length_type + " && "
	result += "python3 " + script + " " + llc + " %s " + test_file + " %t " + start_file + " " + _compensation_file + " \"" + sp_root + "\" false"
	return result

config.substitutions.append(('%memset_check_i32_main',
	get_substitution("i32", _start_file, "main")
))
config.substitutions.append(('%memset_check_i32_indirect',
	get_substitution("i32", _start_indirect_file, "pre_main")
))
config.substitutions.append(('%memset_check_i64_main',
	get_substitution("i64", _start_file, "main")
))
config.substitutions.append(('%memset_check_i64_indirect',
	get_substitution("i64", _start_indirect_file, "pre_main")
))

config.excludes.add('check_set.ll')