import sys
import os
from shutil import which

# Only run tests when Patmos is available
config.unsupported = not(config.target_triple.startswith('patmos'))

# Only fail on the last command in a pipe
config.pipefail=False

# Don't look for tests in the mocks and helpers
config.excludes.add('helpers')
config.excludes.add('mock-binaries')
config.excludes.add('mock-includes')
config.excludes.add('mock-std-libs')

# Substitution for mock binaries compiled into the build tree.
# config.test_exec_root is <build>/tools/clang/test
_mock_binaries_dir = os.path.join(config.test_exec_root, "Driver", "Patmos", "mock-binaries")
config.substitutions.append(('%patmos_mock_binaries', _mock_binaries_dir))

if which("platin") is None:
    print("Patmos WCET analyser 'platin' could not be found.")
