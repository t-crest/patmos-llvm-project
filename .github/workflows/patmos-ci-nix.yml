name: Patmos CI Nix

on:
  push:
    branches: '**'
    paths-ignore:
      # Ignore Markdown file changes, as they are just docs
      # You can add more if you want, just be careful
      - '**.md'
  pull_request:
  schedule:
    # Run every monday at 1:00 AM
    - cron: '00 1 * * MON'

jobs:
  # https://nix.dev/guides/recipes/continuous-integration-github-actions
  nix-build-test:
    name: Nix Build and Test (${{ matrix.system }})
    runs-on: ${{ matrix.platform }}
    strategy:
      # Each leg takes hours; one platform failing must not cancel the
      # other leg's build.
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-latest
            system: x86_64-linux
          - platform: macos-latest
            system: aarch64-darwin
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: cachix/install-nix-action@v31.10.6
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true
      # Cachix is a nice-to-have for substitution; if it is unavailable,
      # nix falls back to cache.nixos.org and building from source.
      - name: Set up cachix (optional)
        continue-on-error: true
        uses: cachix/cachix-action@v17
        with:
          name: patmos-llvm
          # If you chose API tokens for write access OR if you have a private cache
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
      # Evaluation gate: fail fast on broken Nix expressions.
      - name: Evaluate flake
        run: nix flake show --show-trace --accept-flake-config
      # Runs the README-Maintainers test sequence (LLVM, Clang, LLD, and
      # compiler-rt unit tests) through the flake checks defined in pkgs/.
      - name: Run Patmos test suites
        run: nix flake check --show-trace --accept-flake-config
      # Ensure the packaged toolchain still builds from the pushed commit.
      - name: Build patmos-prefixed
        run: nix build --no-link --print-out-paths .#patmos-prefixed

  # Separated from testing: cache the toolchain and the test derivations so
  # local machines (e.g. laptops) substitute them from cachix instead of
  # recompiling when running `nix flake check` locally.
  cachix-push:
    name: Push to Cachix (${{ matrix.system }})
    runs-on: ${{ matrix.platform }}
    needs: [nix-build-test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-latest
            system: x86_64-linux
          - platform: macos-latest
            system: aarch64-darwin
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: cachix/install-nix-action@v31.10.6
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true
      # Cachix auth is optional: a failed push below prints a warning, but
      # the builds above are unaffected.
      - name: Set up cachix (optional)
        continue-on-error: true
        uses: cachix/cachix-action@v17
        with:
          name: patmos-llvm
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
      # Building must succeed regardless of cachix.
      - name: Build toolchain and every test derivation
        run: |
          SYSTEM=$(nix eval --raw --impure --expr 'builtins.currentSystem')
          : > /tmp/paths
          nix build --no-link --print-out-paths .#patmos-prefixed >> /tmp/paths
          CHECKS=$(nix eval --json ".#checks.$SYSTEM" --apply 'c: builtins.concatStringsSep " " (builtins.attrNames c)' --accept-flake-config | tr -d '"')
          for check in $CHECKS; do
            nix build --no-link --print-out-paths ".#checks.$SYSTEM.$check" >> /tmp/paths
          done
      # Nice to have: cache push failures are warnings, not build failures.
      - name: Push to Cachix (optional)
        run: |
          cachix push patmos-llvm < /tmp/paths \
            || echo "::warning::cachix push failed; the binaries were built successfully regardless"

  # Publish the Nix-built, test-gated portable tarball for non-Nix machines.
  # act can validate this job's wiring without repo writes: the publish step
  # is skipped when ACT is set (act push --eventpath <tag-event>).
  release-tarball:
    name: Release Nix-built tarball (${{ matrix.system }})
    runs-on: ${{ matrix.platform }}
    needs: [nix-build-test]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-latest
            system: x86_64-linux
          - platform: macos-latest
            system: aarch64-darwin
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: cachix/install-nix-action@v31.10.6
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true
      - name: Set up cachix (optional)
        continue-on-error: true
        uses: cachix/cachix-action@v17
        with:
          name: patmos-llvm
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
      # This derivation requires every test suite to have passed; the Nix
      # build graph enforces it.
      - name: Build test-gated portable tarball
        run: nix build --accept-flake-config -L .#patmos-tarball -o result-tarball
      - name: Publish to GitHub Releases
        if: ${{ !env.ACT }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "Patmos LLVM ${{ github.ref_name }}" \
            --generate-notes \
            --target ${{ github.sha }} || true
          gh release upload "${{ github.ref_name }}" result-tarball/*.tar.gz --clobber
