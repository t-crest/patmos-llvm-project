name: Patmos CI

on:
  push: 
    branches: '**'
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-**'
    paths-ignore:
      # Ignore Markdown file changes, as they are just docs
      # Nix files are handles by patmos-ci-nix.yml, so we can ignore them here to avoid unnecessary CI runs.
      # You can add more if you want, just be careful
      - '**.md'
      - '**.nix'
      - '.github/workflows/patmos-ci-nix.yml'
  pull_request:
  schedule:
    # Run every monday at 1:00 AM
    - cron: '00 1 * * MON'

env:
  CARGO_TERM_COLOR: always
  J: -j3 # NOPE, DO NOT TOUCH THIS, MORE THAN 3 JOBS WILL CRASH THE CI/CD
  BUILD_PATH: build
  INSTALL_PATH: build/local
  LLVM_PATH: llvm
  CLANG_PATH: clang
  COMPILER_RT_PATH: compiler-rt
  COMPILER_RT_BUILD_PATH: build-compiler-rt
  NEWLIB_PATH: patmos-newlib
  NEWLIB_BUILD_PATH: build-newlib
  BENCH_PATH: patmos-benchmarks
  BENCH_BUILD_PATH: build-bench
  CET_TESTS_PATH: patmos-cet-test-suite
  LLD_PATH: lld

jobs:
  test-non-patmos:
    name: Test Non-Patmos
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
    env: 
      CC: gcc
      CXX: g++
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/install-dependencies
      - name: Build and Run LLVM Unit and Regression Tests
        uses: ./.github/actions/build-test-all
        with:
          targets: X86
          enable-assertions: true
          exclude-reg: "(Clang :: Lexer/case-insensitive-include.c)|(Clang :: Lexer/case-insensitive-system-include.c)|(Clang :: Modules/inferred-framework-case.m)|(Clang :: Preprocessor/nonportable-include-with-hmap.c)"
          include-only: "."
          default-target: x86_64-unknown-linux-gnu
          compiler-rt-tests: 'X86_64LinuxConfig'
          enable-package: false
      - name: Finalize LLVM Build
        working-directory: ${{env.BUILD_PATH}}
        run: make $J llc llvm-link clang llvm-config llvm-objdump opt
  
  test-non-patmos-cmake:
    name: Test Non-Patmos (CMake + Ninja)
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
    env:
      CC: gcc
      CXX: g++
    steps:
      - uses: actions/checkout@v4
      - name: Cache CMake/Ninja build state (GitHub)
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.BUILD_PATH }}/
            ${{ env.COMPILER_RT_BUILD_PATH }}/
            ~/.ccache/
          key: ${{ runner.os }}-test-non-patmos-cmake-${{ hashFiles('llvm/CMakeLists.txt', 'clang/CMakeLists.txt', 'compiler-rt/CMakeLists.txt', '.github/actions/build-cmake-ninja/action.yml') }}
          restore-keys: |
            ${{ runner.os }}-test-non-patmos-cmake-
            ${{ runner.os }}-
      - uses: ./.github/actions/install-dependencies
      - uses: ./.github/actions/build-cmake-ninja
        with:
          targets: X86
          default-target: x86_64-unknown-linux-gnu
          enable-assertions: true
          exclude-reg: "(Clang :: Lexer/case-insensitive-include.c)|(Clang :: Lexer/case-insensitive-system-include.c)|(Clang :: Modules/inferred-framework-case.m)|(Clang :: Preprocessor/nonportable-include-with-hmap.c)"
          include-only: "."
          compiler-rt-tests: X86_64LinuxConfig
          enable-package: false
          enable-tests: false
          parallelism: '3'


  package-patmos-cmake:
    # Note: The Cmake action config already invokes the test action within, so
    # don't be alarmed if "build-test-cmake" is "missing" here.
    name: Build, Test, and Package with CMake + Ninja (${{matrix.platform}})
    runs-on: ${{matrix.platform}}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: namespace-profile-llvm
            cc: clang
            cxx: clang++
            # Tweak it as required, it should be high enough to speed up, but not too high
            # to crash due to out of memory issues.
            parallelism: '8'

    env:
      CC: ${{matrix.cc}}
      CXX: ${{matrix.cxx}}

    steps:
      - name: Checkout with Namespace Git mirror
        if: contains(matrix.platform, 'namespace-profile')
        uses: namespacelabs/nscloud-checkout-action@v8
        with:
          fetch-depth: 10
      - name: Checkout (GitHub-hosted runners)
        if: ${{ !contains(matrix.platform, 'namespace-profile') }}
        uses: actions/checkout@v4
      - name: Cache build state (Namespace cache volume)
        if: contains(matrix.platform, 'namespace-profile')
        uses: namespacelabs/nscloud-cache-action@v1
        with:
          path: |
            ${{ env.BUILD_PATH }}/
            ${{ env.COMPILER_RT_BUILD_PATH }}/
            ${{ env.NEWLIB_BUILD_PATH }}/
            ${{ env.BENCH_BUILD_PATH }}/
            ~/.ccache/
      - name: Cache build state (GitHub cache)
        if: ${{ !contains(matrix.platform, 'namespace-profile') }}
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.BUILD_PATH }}/
            ${{ env.COMPILER_RT_BUILD_PATH }}/
            ${{ env.NEWLIB_BUILD_PATH }}/
            ${{ env.BENCH_BUILD_PATH }}/
            ~/.ccache/
          key: ${{ runner.os }}-${{ matrix.platform }}-package-cmake-${{ hashFiles('**/CMakeLists.txt', '**/configure', '.github/actions/build-cmake-ninja/action.yml') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.platform }}-package-cmake-
            ${{ runner.os }}-${{ matrix.platform }}-
            ${{ runner.os }}-
      - uses: ./.github/actions/install-dependencies
      - uses: ./.github/actions/build-cmake-ninja
        with:
          targets: Patmos
          default-target: patmos-unknown-unknown-elf
          enable-assertions: true
          exclude-reg: ""
          include-only: Patmos
          compiler-rt-tests: patmos
          enable-package: true
          enable-tests: true
          artifact-name: package-${{matrix.platform}}
          parallelism: ${{ matrix.parallelism }}

  package-patmos:
    name: Build, Test, and Package (${{matrix.platform}})
    runs-on: ${{matrix.platform}}
    strategy:
      fail-fast: false
      matrix:
        include: 
          - platform: ubuntu-latest
            cc: gcc
            cxx: g++
          - platform: ubuntu-24.04
            cc: gcc
            cxx: g++
          - platform: macos-latest # ARM
            cc: clang
            cxx: clang++
          - platform: macos-14 # ARM
            cc: clang
            cxx: clang++
          # TODO: Re-enable Namespace CI once the LLVM build is stable enough.
          # For now it is just wasting resources and making it harder to identify issues in the CI.
          #- platform: namespace-profile-llvm
          #  cc: clang
          #  cxx: clang++
          
    env:
      CC: ${{matrix.cc}}
      CXX: ${{matrix.cxx}}
    
    steps:
      - name: Checkout with Namespace Git mirror
        if: contains(matrix.platform, 'namespace-profile')
        uses: namespacelabs/nscloud-checkout-action@v8
        with:
          fetch-depth: 10
      - name: Checkout (GitHub-hosted runners)
        if: ${{ !contains(matrix.platform, 'namespace-profile') }}
        uses: actions/checkout@v4
      - name: Cache build state (Namespace cache volume)
        if: contains(matrix.platform, 'namespace-profile')
        uses: namespacelabs/nscloud-cache-action@v1
        with:
          path: |
            ${{ env.BUILD_PATH }}/
            ${{ env.COMPILER_RT_BUILD_PATH }}/
            ${{ env.NEWLIB_BUILD_PATH }}/
            ~/.ccache/
      - name: Cache build state (GitHub cache)
        if: ${{ !contains(matrix.platform, 'namespace-profile') }}
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.BUILD_PATH }}/
            ${{ env.COMPILER_RT_BUILD_PATH }}/
            ${{ env.NEWLIB_BUILD_PATH }}/
            ~/.ccache/
          key: ${{ runner.os }}-${{ matrix.platform }}-package-make-${{ hashFiles('**/CMakeLists.txt', '**/configure', '.github/actions/build-test-all/action.yml') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.platform }}-package-make-
            ${{ runner.os }}-${{ matrix.platform }}-
            ${{ runner.os }}-
      - uses: ./.github/actions/install-dependencies
      - name: Build with Make, Run LLVM Unit and Regression Tests, and Package
        uses: ./.github/actions/build-test-all
        with:
          enable-assertions: true
          artifact-name: package-${{matrix.platform}}

  test-benchmarks:
    name: Test Benchmarks (${{matrix.platform}})
    runs-on: ${{matrix.platform}}
    strategy:
      fail-fast: false
      matrix:
        include: 
          - platform: ubuntu-latest
            cc: gcc
            cxx: g++
          - platform: ubuntu-22.04
            cc: gcc
            cxx: g++
          - platform: macos-latest # ARM
            cc: clang
            cxx: clang++
          - platform: macos-14 # ARM
            cc: clang
            cxx: clang++
          - platform: namespace-profile-llvm
            cc: clang
            cxx: clang++
    needs: [package-patmos]     
    env:
      CC: ${{matrix.cc}}
      CXX: ${{matrix.cxx}}
    
    steps:
      - name: Checkout with Namespace Git mirror
        if: contains(matrix.platform, 'namespace-profile')
        uses: namespacelabs/nscloud-checkout-action@v8
        with:
          fetch-depth: 10
      - name: Checkout (GitHub-hosted runners)
        if: ${{ !contains(matrix.platform, 'namespace-profile') }}
        uses: actions/checkout@v4
      - name: Cache benchmark/build state (Namespace cache volume)
        if: contains(matrix.platform, 'namespace-profile')
        uses: namespacelabs/nscloud-cache-action@v1
        with:
          path: |
            ${{ env.BUILD_PATH }}/
            ${{ env.BENCH_BUILD_PATH }}/
            ~/.ccache/
      - name: Cache benchmark/build state (GitHub cache)
        if: ${{ !contains(matrix.platform, 'namespace-profile') }}
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.BUILD_PATH }}/
            ${{ env.BENCH_BUILD_PATH }}/
            ~/.ccache/
          key: ${{ runner.os }}-${{ matrix.platform }}-bench-${{ hashFiles('**/CMakeLists.txt', '.github/actions/test-benchmarks/action.yml') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.platform }}-bench-
            ${{ runner.os }}-${{ matrix.platform }}-
            ${{ runner.os }}-
      - uses: ./.github/actions/install-dependencies
      - name: Build and Run LLVM Unit and Regression Tests
        uses: ./.github/actions/test-benchmarks
        with:
          artifact-name: package-${{matrix.platform}}

  release:
    name: Release (${{matrix.platform}})
    runs-on: ${{matrix.platform}}
    permissions:
      contents: write 
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: ubuntu-latest
            cc: gcc
            cxx: g++
          - platform: ubuntu-22.04
            cc: gcc
            cxx: g++
          - platform: macos-latest # ARM
            cc: clang
            cxx: clang++
          - platform: macos-14 # ARM
            cc: clang
            cxx: clang++
          - platform: namespace-profile-llvm
            cc: clang
            cxx: clang++
    # Run after the test jobs finish
    # Temporarily remove test-benchmarks, due to benchmarking tools are way out of date.
    # Todo: Reintroduce it after the benchmarking tools are updated and the benchmarks are fixed to work with the new LLVM version.
    needs: [package-patmos, test-non-patmos]
    # Run only if this was triggered by a tag
    if: github.event_name == 'push' && contains(github.ref, 'refs/tags/')
    env:
      RELEASE_TAR: patmos-llvm*.tar.gz
      PATMOS_TRIPLE: patmos-unknown-unknown-elf
      CC: ${{matrix.cc}}
      CXX: ${{matrix.cxx}}
    
    steps:
      - name: Checkout with Namespace Git mirror
        if: contains(matrix.platform, 'namespace-profile')
        uses: namespacelabs/nscloud-checkout-action@v8
        with:
          fetch-depth: 1
      - name: Checkout (GitHub-hosted runners)
        if: ${{ !contains(matrix.platform, 'namespace-profile') }}
        uses: actions/checkout@v4
      - name: Cache toolchains/build state (Namespace cache volume)
        if: contains(matrix.platform, 'namespace-profile')
        uses: namespacelabs/nscloud-cache-action@v1
        with:
          path: |
            ${{ env.BUILD_PATH }}/
            ${{ env.COMPILER_RT_BUILD_PATH }}/
            ${{ env.NEWLIB_BUILD_PATH }}/
            ~/.ccache/
      - name: Cache toolchains/build state (GitHub cache)
        if: ${{ !contains(matrix.platform, 'namespace-profile') }}
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.BUILD_PATH }}/
            ${{ env.COMPILER_RT_BUILD_PATH }}/
            ${{ env.NEWLIB_BUILD_PATH }}/
            ~/.ccache/
          key: ${{ runner.os }}-${{ matrix.platform }}-release-make-${{ hashFiles('**/CMakeLists.txt', '**/configure', '.github/actions/build-test-all/action.yml') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.platform }}-release-make-
            ${{ runner.os }}-${{ matrix.platform }}-
            ${{ runner.os }}-
      - uses: ./.github/actions/install-dependencies
      - name: Build LLVM, Compiler-RT, Newlib, and Package
        uses: ./.github/actions/build-test-all
        with:
          # Compiler currently doesn't work without assertions enabled
          enable-assertions: true
          enable-tests: false
          artifact-name: package-${{matrix.platform}}-release
      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: ${{env.BUILD_PATH}}/patmos-unknown-unknown-elf/package-temp/patmos-llvm-*.tar.gz

  release-cmake:
    name: Release with CMake + Ninja (${{matrix.platform}})
    runs-on: ${{matrix.platform}}
    permissions:
      contents: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: namespace-profile-llvm
            cc: clang
            cxx: clang++
            parallelism: '4'
    # Temporarily remove test-benchmarks, due to benchmarking tools are way out of date.
    # Todo: Reintroduce it after the benchmarking tools are updated and the benchmarks are fixed to work with the new LLVM version.
    needs: [package-patmos-cmake, test-non-patmos-cmake]
    # Run only if this was triggered by a tag
    if: github.event_name == 'push' && contains(github.ref, 'refs/tags/')
    env:
      CC: ${{matrix.cc}}
      CXX: ${{matrix.cxx}}

    steps:
      - name: Checkout with Namespace Git mirror
        if: contains(matrix.platform, 'namespace-profile')
        uses: namespacelabs/nscloud-checkout-action@v8
        with:
          fetch-depth: 1
      - name: Checkout (GitHub-hosted runners)
        if: ${{ !contains(matrix.platform, 'namespace-profile') }}
        uses: actions/checkout@v4
      - name: Cache toolchains/build state (Namespace cache volume)
        if: contains(matrix.platform, 'namespace-profile')
        uses: namespacelabs/nscloud-cache-action@v1
        with:
          path: |
            ${{ env.BUILD_PATH }}/
            ${{ env.COMPILER_RT_BUILD_PATH }}/
            ${{ env.NEWLIB_BUILD_PATH }}/
            ~/.ccache/
      - name: Cache toolchains/build state (GitHub cache)
        if: ${{ !contains(matrix.platform, 'namespace-profile') }}
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.BUILD_PATH }}/
            ${{ env.COMPILER_RT_BUILD_PATH }}/
            ${{ env.NEWLIB_BUILD_PATH }}/
            ~/.ccache/
          key: ${{ runner.os }}-${{ matrix.platform }}-release-cmake-${{ hashFiles('**/CMakeLists.txt', '**/configure', '.github/actions/build-cmake-ninja/action.yml') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.platform }}-release-cmake-
            ${{ runner.os }}-${{ matrix.platform }}-
            ${{ runner.os }}-
      - uses: ./.github/actions/install-dependencies
      - uses: ./.github/actions/build-cmake-ninja
        with:
          targets: Patmos
          default-target: patmos-unknown-unknown-elf
          enable-assertions: true
          exclude-reg: ""
          include-only: Patmos
          compiler-rt-tests: patmos
          enable-package: true
          enable-tests: false
          artifact-name: package-${{matrix.platform}}-release
          parallelism: ${{ matrix.parallelism }}
      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: ${{env.BUILD_PATH}}/patmos-unknown-unknown-elf/package-temp/patmos-llvm-*.tar.gz
