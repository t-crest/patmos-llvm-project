name: 'Build with CMake and Ninja'
description: 'Builds using CMake with Ninja and ccache for faster incremental builds.'
inputs:
  targets:
    description: 'Which target architectures to build for.'
    required: true
    default: Patmos
  default-target:
    description: 'Which target triple should be the default.'
    required: true
    default: patmos-unknown-unknown-elf
  enable-assertions:
    description: 'Whether to enable assertions.'
    required: true
    default: 'false'
  exclude-reg:
    description: 'Exclude regression test. Should be a pipe-separated list.'
    required: true
    default: ''
  include-only:
    description: 'Include tests, testing only the given. Should be a pipe-separated list.'
    required: true
    default: 'Patmos'
  compiler-rt-tests:
    description: 'Which folder under build-compiler-rt/test/builtins/Unit/ to test'
    required: true
    default: 'patmos'
  enable-package:
    description: 'Whether packaging and benchmark testing should be done.'
    required: true
    default: 'true'
  enable-tests:
    description: 'Whether to run any tests'
    required: true
    default: 'true'
  artifact-name:
    description: 'The name to use for the github artifact uploaded of the built package.'
    required: false
  parallelism:
    description: 'Number of parallel jobs for builds'
    required: false
    default: '4'

runs:
  using: "composite"
  steps:
    - name: Create build folders
      shell: bash
      run: |
        mkdir -p $BUILD_PATH
        mkdir -p $COMPILER_RT_BUILD_PATH
        mkdir -p $NEWLIB_BUILD_PATH

    - name: Setup ccache
      shell: bash
      run: |
        if command -v ccache &> /dev/null; then
          echo "ccache found at $(which ccache)"
        else
          if [ "$RUNNER_OS" == "macOS" ]; then
            brew install ccache
          else
            sudo apt-get update && sudo apt-get install -y ccache
          fi
        fi
        # Setup ccache for CMake
        mkdir -p ~/.ccache
        echo "max_size = 2G" >> ~/.ccache/ccache.conf
        echo "compression = true" >> ~/.ccache/ccache.conf
      env:
        RUNNER_OS: ${{ runner.os }}

    - name: Configure LLVM Build (CMake + Ninja)
      shell: bash
      working-directory: ${{env.BUILD_PATH}}
      env:
        TARGETS: ${{ inputs.targets }}
        DEFAULT_TARGET: ${{ inputs.default-target }}
        ENABLE_ASSERTIONS: ${{ inputs.enable-assertions }}
        PARALLELISM: ${{ inputs.parallelism }}
      run: |
        cmake $GITHUB_WORKSPACE/$LLVM_PATH \
          -G Ninja \
          -DCMAKE_C_COMPILER_LAUNCHER=ccache \
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
          -DCMAKE_CXX_STANDARD=14 \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_INSTALL_PREFIX=$GITHUB_WORKSPACE/$INSTALL_PATH \
          -DLLVM_TARGETS_TO_BUILD=$TARGETS \
          -DLLVM_DEFAULT_TARGET_TRIPLE=$DEFAULT_TARGET \
          -DLLVM_ENABLE_PROJECTS="clang;lld" \
          -DCLANG_ENABLE_ARCMT=false \
          -DCLANG_ENABLE_STATIC_ANALYZER=false \
          -DCLANG_BUILD_EXAMPLES=false \
          -DLLVM_ENABLE_BINDINGS=false \
          -DLLVM_INSTALL_BINUTILS_SYMLINKS=false \
          -DLLVM_INSTALL_CCTOOLS_SYMLINKS=false \
          -DLLVM_INCLUDE_EXAMPLES=false \
          -DLLVM_INCLUDE_BENCHMARKS=false \
          -DLLVM_APPEND_VC_REV=false \
          -DLLVM_ENABLE_WARNINGS=false \
          -DLLVM_ENABLE_PEDANTIC=false \
          -DLLVM_ENABLE_LIBPFM=false \
          -DLLVM_BUILD_INSTRUMENTED_COVERAGE=false \
          -DLLVM_INSTALL_UTILS=false \
          -DLLVM_ENABLE_ASSERTIONS=$ENABLE_ASSERTIONS \
          -DLLVM_PARALLEL_COMPILE_JOBS=$PARALLELISM \
          -DLLVM_PARALLEL_LINK_JOBS=$PARALLELISM

    - run: echo "::group::Build LLVM with Ninja"
      shell: bash

    - name: Build LLVM with Ninja (all tools)
      shell: bash
      working-directory: ${{env.BUILD_PATH}}
      env:
        PARALLELISM: ${{ inputs.parallelism }}
      run: |
        echo "Building with $PARALLELISM parallel jobs..."
        ninja -j $PARALLELISM all -v
        echo "Build complete!"

    - name: Report ccache statistics
      if: always()
      shell: bash
      run: |
        echo "=== ccache statistics ==="
        ccache -s || echo "ccache not available"

    - run: echo "::endgroup::"
      shell: bash

    - name: Quick validation of core tools
      shell: bash
      working-directory: ${{env.BUILD_PATH}}
      run: |
        echo "Checking built tools..."
        ./bin/llvm-config --version
        ./bin/clang --version
        ./bin/llc --version

    - name: Run LLD Tests
      if: inputs.enable-tests == 'true'
      uses: ./.github/actions/build-test-cmake
      with:
        targets: lld
        path: ${{env.LLD_PATH}}/test
        working-dir: ${{env.BUILD_PATH}}
        include: ${{inputs.include-only}}
        parallelism: ${{ inputs.parallelism }}

    - name: Run LLVM Unit Tests
      if: inputs.enable-tests == 'true'
      uses: ./.github/actions/build-test-cmake
      with:
        targets: ''
        path: ${{env.LLVM_PATH}}/test
        working-dir: ${{env.BUILD_PATH}}
        include: ${{inputs.include-only}}
        exclude: ${{inputs.exclude-reg}}
        parallelism: ${{ inputs.parallelism }}

    - name: Run LLVM Regression Tests
      if: inputs.enable-tests == 'true'
      uses: ./.github/actions/build-test-cmake
      with:
        targets: ''
        path: ${{env.LLVM_PATH}}/test
        working-dir: ${{env.BUILD_PATH}}
        include: ${{inputs.include-only}}
        exclude: LLVM-Unit
        parallelism: ${{ inputs.parallelism }}



    - name: Configure Compiler-RT Build (Non-Patmos)
      if: ${{ !startsWith(inputs.default-target, 'patmos') }}
      working-directory: ${{env.COMPILER_RT_BUILD_PATH}}
      shell: bash
      env:
        TARGETS: ${{ inputs.targets }}
      run: |
        cmake $GITHUB_WORKSPACE/$COMPILER_RT_PATH \
          -G Ninja \
          -DCMAKE_C_COMPILER_LAUNCHER=ccache \
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
          -DCOMPILER_RT_INCLUDE_TESTS=ON \
          -DCOMPILER_RT_TEST_STANDALONE_BUILD_LIBS=OFF \
          -DCOMPILER_RT_DEFAULT_TARGET_ONLY=ON \
          -DCOMPILER_RT_TEST_COMPILER="$GITHUB_WORKSPACE/$BUILD_PATH/bin/clang" \
          -DLLVM_CONFIG_PATH="$GITHUB_WORKSPACE/$BUILD_PATH/bin/llvm-config" \
          -DCMAKE_C_COMPILER="$GITHUB_WORKSPACE/$BUILD_PATH/bin/clang" \
          -DCMAKE_CXX_COMPILER="$GITHUB_WORKSPACE/$BUILD_PATH/bin/clang++" \
          -DCMAKE_C_COMPILER_TARGET="${{inputs.default-target}}"

    - name: Configure Compiler-RT Build (Patmos)
      if: startsWith(inputs.default-target, 'patmos')
      working-directory: ${{env.COMPILER_RT_BUILD_PATH}}
      shell: bash
      env:
        TARGETS: ${{ inputs.targets }}
      run: |
        cmake $GITHUB_WORKSPACE/$COMPILER_RT_PATH \
          -G Ninja \
          -DCMAKE_C_COMPILER_LAUNCHER=ccache \
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
          -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/$COMPILER_RT_PATH/cmake/patmos-clang-toolchain.cmake" \
          -DCMAKE_C_COMPILER="$GITHUB_WORKSPACE/$BUILD_PATH/bin/clang" \
          -DCMAKE_CXX_COMPILER="$GITHUB_WORKSPACE/$BUILD_PATH/bin/clang++" \
          -DCOMPILER_RT_TEST_COMPILER="$GITHUB_WORKSPACE/$BUILD_PATH/bin/clang" \
          -DLLVM_TOOLS_BINARY_DIR="$GITHUB_WORKSPACE/$BUILD_PATH/bin" \
          -DLLVM_CONFIG_PATH="$GITHUB_WORKSPACE/$BUILD_PATH/bin/llvm-config" \
          -DCOMPILER_RT_INCLUDE_TESTS=ON \
          -DCOMPILER_RT_TEST_STANDALONE_BUILD_LIBS=OFF

    - name: Build Compiler-RT Tests
      if: inputs.enable-tests == 'true'
      shell: bash
      working-directory: ${{env.COMPILER_RT_BUILD_PATH}}
      env:
        PARALLELISM: ${{ inputs.parallelism }}
      run: ninja -j $PARALLELISM

    - name: Run Compiler-RT Unit Tests
      uses: ./.github/actions/build-test-cmake
      with:
        targets: ''
        path: ${{env.COMPILER_RT_BUILD_PATH}}/test/builtins/Unit/${{inputs.compiler-rt-tests}}
        working-dir: ${{env.COMPILER_RT_BUILD_PATH}}
        exclude: ${{inputs.exclude-reg}}
        enable-tests: ${{ inputs.enable-tests }}
        parallelism: ${{ inputs.parallelism }}

    - name: Download Newlib
      if: inputs.enable-package == 'true'
      env:
        NEWLIB_COMMIT: 57965996de83d7a8d9b938b8b2b950ea48efa8cb
      shell: bash
      run: |
        git clone https://github.com/t-crest/patmos-newlib ${{env.NEWLIB_PATH}}
        cd ${{env.NEWLIB_PATH}}
        git checkout $NEWLIB_COMMIT

    - name: Test-Build Newlib
      if: (inputs.enable-package == 'true') && (inputs.enable-tests == 'true')
      working-directory: ${{env.NEWLIB_BUILD_PATH}}
      shell: bash
      run: |
        $GITHUB_WORKSPACE/$NEWLIB_PATH/configure MKDIR_P="/bin/mkdir -p" --target=patmos-unknown-unknown-elf AR_FOR_TARGET="$GITHUB_WORKSPACE/$BUILD_PATH/bin/llvm-ar" CC_FOR_TARGET="$GITHUB_WORKSPACE/$BUILD_PATH/bin/clang" CFLAGS_FOR_TARGET="-target patmos-unknown-unknown-elf -O2 -emit-llvm -D__GLIBC_USE\(...\)=0 -Wno-implicit-function-declaration -Wno-int-conversion -Wno-incompatible-pointer-types" RANLIB_FOR_TARGET="$GITHUB_WORKSPACE/$BUILD_PATH/bin/llvm-ranlib" LD_FOR_TARGET="$GITHUB_WORKSPACE/$BUILD_PATH/bin/clang"
        make
        rm -rf *

    - name: Build Newlib
      if: inputs.enable-package == 'true'
      working-directory: ${{env.NEWLIB_BUILD_PATH}}
      shell: bash
      run: |
        $GITHUB_WORKSPACE/$NEWLIB_PATH/configure --target=patmos-unknown-unknown-elf AR_FOR_TARGET="$GITHUB_WORKSPACE/$BUILD_PATH/bin/llvm-ar" CC_FOR_TARGET="$GITHUB_WORKSPACE/$BUILD_PATH/bin/clang" CFLAGS_FOR_TARGET="-target patmos-unknown-unknown-elf -O2 -emit-llvm -Wno-error -Wno-error=deprecated-non-prototype -Wno-error=invalid-noreturn -D__GLIBC_USE\(...\)=0 -Wno-implicit-function-declaration -Wno-int-conversion -Wno-incompatible-pointer-types" RANLIB_FOR_TARGET="$GITHUB_WORKSPACE/$BUILD_PATH/bin/llvm-ranlib" LD_FOR_TARGET="$GITHUB_WORKSPACE/$BUILD_PATH/bin/clang"
        make

    - name: Run Clang Unit Tests
      if: inputs.enable-tests == 'true'
      uses: ./.github/actions/build-test-cmake
      with:
        targets: ''
        path: ${{env.CLANG_PATH}}/test
        working-dir: ${{env.BUILD_PATH}}
        include: ${{inputs.include-only}}
        exclude: ${{inputs.exclude-reg}}
        lit-args: --allow-empty-runs
        parallelism: ${{ inputs.parallelism }}

    - name: Run Clang Regression Tests
      if: inputs.enable-tests == 'true'
      uses: ./.github/actions/build-test-cmake
      with:
        targets: ''
        path: ${{env.CLANG_PATH}}/test
        working-dir: ${{env.BUILD_PATH}}
        include: ${{inputs.include-only}}
        exclude: Clang-Unit
        parallelism: ${{ inputs.parallelism }}

    - name: Build Package with Ninja
      working-directory: ${{env.BUILD_PATH}}
      if: inputs.enable-package == 'true'
      shell: bash
      env:
        PARALLELISM: ${{ inputs.parallelism }}
      run: ninja -j $PARALLELISM PatmosPackage

    - name: Install Compiler Binaries
      working-directory: ${{env.BUILD_PATH}}
      if: (inputs.enable-package == 'true') && (inputs.enable-tests == 'true')
      shell: bash
      run: tar -xvf $(find . -name 'patmos-llvm-*.tar.gz') -C $GITHUB_WORKSPACE/$INSTALL_PATH

    - name: Download CET Test Suite
      if: (inputs.enable-package == 'true') && (inputs.enable-tests == 'true')
      env:
        CET_TESTS_COMMIT: 82a96fa3f13ce8e916bc56872c10bfa5b00652de
      shell: bash
      run: |
        git clone https://github.com/t-crest/patmos-cet-test-suite ${{env.CET_TESTS_PATH}}
        cd ${{env.CET_TESTS_PATH}}
        git checkout $CET_TESTS_COMMIT

    - name: Run CET Test Suite
      if: (inputs.enable-package == 'true') && (inputs.enable-tests == 'true')
      working-directory: ${{env.CET_TESTS_PATH}}
      shell: bash
      run: |
        $GITHUB_WORKSPACE/$BUILD_PATH/bin/llvm-lit . -v --filter="^(?!((.*/dijkstra.c)|(.*/gsm_dec.c)|(.*/huff_dec.c)|(.*/st.c)|(.*/minver.c)|(.*/cosf.c))).*"

    - name: Upload Package Artifact
      if: inputs.enable-package == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: ${{inputs.artifact-name}}
        path: ${{env.BUILD_PATH}}/patmos-unknown-unknown-elf/package-temp/patmos-llvm-*.tar.gz

