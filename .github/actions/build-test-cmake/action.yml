name: 'Build then Run Test (CMake/Ninja)'
description: 'Builds with CMake/Ninja and runs tests.'
inputs:
  targets:
    description: 'Which Ninja target to build before the test.'
    required: true
    default: ''
  path:
    description: 'The path to the directory that needs to be tested relative to $GITHUB_WORKSPACE.'
    required: true
  working-dir:
    description: 'The working path for the test.'
    required: true
  exclude:
    description: 'Exclude tests that start with a given string. Each string must be encapsulated in parentheses and separated by pipes (|).'
    required: true
    default: ''
  include:
    description: 'Include tests, testing only the given. Should be a pipe-separated list.'
    required: true
    default: '.'
  lit-args:
    description: 'Additional args to pass to LLVM-lit.'
    required: false
    default: ''
  enable-tests:
    description: 'Whether to run any tests'
    required: true
    default: 'true'
  parallelism:
    description: 'Number of parallel jobs for builds'
    required: false
    default: '16'

runs:
  using: "composite"
  steps:
    - if: inputs.targets != ''
      working-directory: ${{ inputs.working-dir }}
      shell: bash
      env:
        TARGETS: ${{ inputs.targets }}
        PARALLELISM: ${{ inputs.parallelism }}
      run: ninja -j $PARALLELISM $TARGETS

    - if: inputs.enable-tests == 'true'
      working-directory: ${{ inputs.working-dir }}
      shell: bash
      env:
        EXCLUDE: ${{ inputs.exclude }}
        INCLUDE: ${{ inputs.include }}
        TEST_PATH: ${{ inputs.path }}
        LIT_ARGS: ${{ inputs.lit-args }}
      run: |
        # Build a safe filter only when useful. Avoid passing an empty/garbled
        # filter string to llvm-lit which can cause unexpected "no match" errors.
        PRE_FILTER=""
        FILTER=""

        if [ -n "$EXCLUDE" ]; then
          # Negative lookahead for excludes (keeps the rest generic)
          EXCLUDE_FILTER="^(?!($EXCLUDE)).*"
        fi

        # If INCLUDE is provided and not set to '.' (meaning "all"), build a
        # composed filter. Otherwise do not pass any --filter at all.
        if [ -n "$INCLUDE" ] && [ "$INCLUDE" != "." ]; then
          if [ -n "$EXCLUDE_FILTER" ]; then
            FILTER="${EXCLUDE_FILTER}(${INCLUDE})"
          else
            FILTER="(${INCLUDE})"
          fi
          PRE_FILTER="--filter"
          echo "Filter: $FILTER"
        fi

        # Optional debug: dump discovered tests when DEBUG_LIT_SHOW=1
        if [ "${DEBUG_LIT_SHOW:-0}" = "1" ]; then
          echo "Showing discovered tests (first 200):"
          ./bin/llvm-lit -v $GITHUB_WORKSPACE/$TEST_PATH --show-tests | head -200 || true
        fi

        # Before running llvm-lit, ensure the filter (if any) actually
        # matches tests. This avoids allowing empty runs silently.
        if [ -n "$PRE_FILTER" ]; then
          echo "Checking for tests matching filter..."
          # Use --show-tests to list tests and grep the composed regex.
          if ! ./bin/llvm-lit -v $GITHUB_WORKSPACE/$TEST_PATH --show-tests | grep -E "$FILTER" -m1 >/dev/null 2>&1; then
            echo "ERROR: filter did not match any tests: $FILTER"
            echo "Set DEBUG_LIT_SHOW=1 to list discovered tests for debugging."
            exit 2
          fi
          ./bin/llvm-lit -v $GITHUB_WORKSPACE/$TEST_PATH "$PRE_FILTER" "$FILTER" $LIT_ARGS
        else
          ./bin/llvm-lit -v $GITHUB_WORKSPACE/$TEST_PATH $LIT_ARGS
        fi

