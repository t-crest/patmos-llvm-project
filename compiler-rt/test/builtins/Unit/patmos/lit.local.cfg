
# Only run tests when Patmos is available
config.unsupported = not(config.target_triple.startswith('patmos'))

# This directory sets no `config.test_format`.
#
# It used to force `lit.formats.ShTest(execute_external=True)`, because the RUN lines
# assigned shell variables (`INPUT=100; ...`). That option is deprecated in LLVM-23 and
# removed in LLVM-24, so the RUN lines now use forms lit's internal shell can run; see
# README.md.
#
# `compiler-rt/test/lit.common.cfg.py` already selects the internal shell, and
# `lit.formats.ShTest` defaults to `execute_external=False`. Inheriting that default
# rather than restating it keeps this directory working once the parameter is gone.

# Define %test-patmos-librt that compiles %s and links it with the builtins and llvm start function.
# Then it runs it on 'pasim' ensuring 0 is returned.
# Prefer llvm_tools_dir because compiler-rt can be configured stand-alone in CI.
bin_path = getattr(config, "llvm_tools_dir", "")
if not bin_path:
    bin_path = config.llvm_obj_root + "/bin"
llc_path = bin_path + "/llc"
lld_path = bin_path + "/ld.lld"
start_file_path = config.llvm_src_root + "/test/CodeGen/Patmos/_start.ll"
start_input_file_path = config.llvm_src_root + "/test/CodeGen/Patmos/programs/bounded/_start.ll"
patmos_librt_path = config.compiler_rt_obj_root + "/lib/generic/libclang_rt.builtins-patmos.a"

compile_to_bc = config.clang + " -O2 -c -emit-llvm %s -o %t_bc -Wno-main"
compile_to_obj = llc_path + " %t_bc -filetype=obj -O0 -o %t_obj"
compile_start_to_obj = llc_path + " " + start_file_path + " -filetype=obj -O0 -o %t_start_obj"
compile_start_input_to_obj = llc_path + " " + start_input_file_path + " -filetype=obj -O0 -o %t_start_obj"
final_link = lld_path + " --nostdlib --static %t_obj %t_start_obj " + patmos_librt_path + " -o %t_exec"
run_pasim = "pasim %t_exec"

# Build and run are separate substitutions so each can take its own arguments.
#
# A RUN line can only append arguments to the end of a substitution, so one substitution
# that both links and runs never sees link-time arguments. Tests that need an input value
# build and run in two steps:
#
#   RUN: %build-patmos-input-librt --defsym input=100
#   RUN: %exec-patmos --print-stats my_function 2>&1 | FileCheck %s
#
# `%t_exec` survives between RUN lines of the same test, and RUN lines run in order, so the
# second line executes the binary the first line built.
build_librt = compile_to_bc + " && " + compile_to_obj + " && " + compile_start_to_obj + " && " + final_link
build_input_librt = compile_to_bc + " && " + compile_to_obj + " && " + compile_start_input_to_obj + " && " + final_link

patmos_substitutions = [
	# Compiles and links %s against the plain start function.
	# Trailing arguments go to the linker.
	("%build-patmos-librt", build_librt),
	# The same, but linked against the start function that forwards `input` to `main`.
	# Trailing arguments go to the linker, and `--defsym input=<value>` is required.
	("%build-patmos-input-librt", build_input_librt),
	# Runs the binary left behind by either build substitution.
	# Trailing arguments go to 'pasim'.
	("%exec-patmos", run_pasim),
	# Builds and runs %s in one step, for tests that take no input.
	("%test-patmos-librt", build_librt + " && " + run_pasim),
]

# lit applies substitutions in registration order, so an inherited substitution that is a
# substring of one of ours would rewrite part of our name and leave a mangled command.
# compiler-rt defines `%run`, which is why the execution substitution is `%exec-patmos`
# rather than `%run-patmos`.
for name, _ in patmos_substitutions:
	for inherited, _replacement in config.substitutions:
		if inherited in name:
			lit_config.fatal(
				"Patmos substitution %r would be corrupted by the inherited substitution "
				"%r. Rename the Patmos substitution." % (name, inherited)
			)

config.substitutions.extend(patmos_substitutions)
